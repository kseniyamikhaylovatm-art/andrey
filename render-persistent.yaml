# Optional paid deployment. Review prices on Render before creating resources.
services:
  - type: web
    name: mi-espanol-andrey-tanya
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: mi-espanol-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/mi-espanol
      - key: APP_ACCESS_CODE
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
